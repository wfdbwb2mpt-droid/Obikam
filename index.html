<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Package Tracking</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      background: white;
      padding: 50px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,.12);
      max-width: 700px;
    }

    .status {
      font-size: 22px;
      color: #16803c;
      font-weight: bold;
      margin-bottom: 30px;
    }

    h1 {
      font-size: clamp(50px, 10vw, 100px);
      margin: 0;
      line-height: 1;
    }

    p {
      margin-top: 30px;
      color: #777;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="status">✓ PACKAGE SUCCESSFULLY DELIVERED</div>

    <h1>YOU'RE<br>WELCOME 😎</h1>

    <p>Tracking status: Your package has been acquired by your extremely generous friend.</p>
  </div>
</body>
</html>
